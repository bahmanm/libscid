[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "libscid"
description = "Python bindings for libscid."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
dynamic = ["version"]
keywords = [
    "chess",
    "chess-database",
    "eco-codes",
    "fide",
    "pgn",
    "scid",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://libscid.bahmanm.com"
Documentation = "https://libscid.bahmanm.com/python/"
Repository = "https://github.com/bahmanm/libscid"
"Bug Tracker" = "https://github.com/bahmanm/libscid/issues"

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.28",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.14",
    "tox>=4.0",
    "tox-uv>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libscid"]
artifacts = [
    "src/libscid/_native/*.dll",
    "src/libscid/_native/*.dylib",
    "src/libscid/_native/*.so",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = ["--doctest-modules"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pyright]
include = ["src", "hatch_build.py"]
exclude = [
    "**/__pycache__",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
