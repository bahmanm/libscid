site_name: libscid Python API
site_url: https://libscid.bahmanm.com/python/
repo_url: https://github.com/bahmanm/libscid
repo_name: bahmanm/libscid
docs_dir: docs
site_dir: _build/docs/site

theme:
  name: material
  logo: assets/img/libscid-tiny.png
  favicon: assets/img/libscid-tiny.png
  font:
    text: Cantarell
    code: Oxygen Mono
  palette:
    - scheme: solarized-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: solarized-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/solarized.css

nav:
  - Overview: index.md
  - Tutorials:
      - First Steps: tutorials/quickstart.md
      - Building a Game Inspector: tutorials/game-inspector.md
      - Analysing Master Archives: tutorials/database-queries.md
  - How-To Guides:
      - Overview: how-to/index.md
      - Parse & Serialise PGN: how-to/parse-and-serialise-pgn.md
      - Move Tree Traversal: how-to/navigate-and-edit-trees.md
      - Database Queries & Filters: how-to/filter-and-search-databases.md
      - Stream Movetext Events: how-to/stream-movetext-events.md
      - Adjudicate Tournament Draws: how-to/adjudicate-draws.md
  - Explanation:
      - Overview: explanation/index.md
      - C ABI Bridge Architecture: explanation/bridge-architecture.md
      - Immutable Cursor Mental Model: explanation/cursor-immutability.md
      - Memory Model & Lifecycles: explanation/memory-and-lifecycles.md
      - Indexing & Filter Algebra: explanation/indexing-and-filters.md
      - Event Streams vs Tree Traversal: explanation/event-stream-vs-tree-walk.md
  - API Reference:
      - Overview: reference/index.md
      - Core (Game & Navigation): reference/core.md
      - Database & Search: reference/database.md
      - PGN, Notation & Events: reference/pgn.md
      - Exceptions: reference/errors.md
