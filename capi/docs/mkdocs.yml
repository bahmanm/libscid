site_name: libscid C ABI
site_url: https://libscid.bahmanm.com/capi/
repo_url: https://github.com/bahmanm/libscid
repo_name: bahmanm/libscid
docs_dir: ../../docs
site_dir: ../_build/docs/site

theme:
  name: material
  logo: assets/img/libscid-tiny.png
  favicon: assets/img/libscid-tiny.png
  font:
    text: Cantarell
    code: Oxygen Mono
  palette:
    - scheme: solarized-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: solarized-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
        - ../..
        - docs
        - ../../docs
  - pymdownx.superfences

extra_css:
  - stylesheets/solarized.css

nav:
  - Overview: index.md
  - Tutorials:
      - Quick Start: tutorials/quick-start.md
  - How-To Guides:
      - Overview: how-to/index.md
      - Installation & Setup: how-to/installation.md
      - Games & PGN:
          - Parse and Edit PGN Tags: how-to/edit-pgn.md
          - Author Games with Variations: how-to/author-pgn.md
          - Nonstandard Start Positions: how-to/nonstandard-start.md
          - Navigate Variation Trees: how-to/navigate-pgn.md
          - Mutate and Merge Move Trees: how-to/mutate-pgn.md
      - Board & Classification:
          - Apply Moves & Enumerate Legals: how-to/position-and-moves.md
          - Classify Positions with ECO: how-to/eco-lookup.md
      - Database Operations:
          - In-Memory Databases: how-to/memory-database.md
          - Enumerate Lightweight Metadata: how-to/list-database.md
          - Replace Games & Manage Deletions: how-to/edit-database.md
          - Persistent SCID5 Collections: how-to/persistent-database.md
          - Batch Import & Export PGN: how-to/import-export-pgn.md
      - Database Search:
          - Search by Header Criteria: how-to/search-headers.md
          - Search by Exact Position: how-to/search-position.md
          - Search by Board & Pawn Structure: how-to/search-board.md
  - C ABI Reference:
      - Modules Overview: reference/index_modules.md
      - Database Management: reference/modules/group__database.md
      - Database Filters & Sorting: reference/modules/group__database__filter.md
      - Database Search Engine: reference/modules/group__database__search.md
      - ECO Classification: reference/modules/group__eco.md
      - Game Management: reference/modules/group__game.md
      - Game Movetext Cursor: reference/modules/group__game__cursor.md
      - PGN Serialisation: reference/modules/group__game__pgn.md
      - Move Representation & Codecs: reference/modules/group__movespec.md
      - Board Position: reference/modules/group__position.md
      - Primitives & Error Codes: reference/modules/group__primitives.md
      - Data Structures: reference/index_classes.md
      - Header Files: reference/index_files.md
  - Explanation:
      - Architecture Overview: explanation/architecture.md
      - Subsystems:
          - Core Chess Model: explanation/architecture/core.md
          - Database Subsystem: explanation/architecture/database.md
          - ECO Classification: explanation/architecture/eco.md
          - Spelling Name Authority: explanation/architecture/spelling.md
      - ABI Design & Encapsulation: explanation/abi-design.md
      - Memory & Buffer Semantics: explanation/memory-model.md
