name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release__unix:
    name: release__${{ matrix.asset_label }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_label: linux
          - os: macos-15
            asset_label: macos-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up libscid toolchain
        uses: ./.github/actions/setup-libscid-toolchain
        with:
          make: "true"
          uv: "true"
          llvm: "true"
          docs: "true"

      - name: Set release identity
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tag="${GITHUB_REF_NAME}"
              version="${tag#v}"
              version="${version%%-*}"

              if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
                  echo "Tag '$tag' does not contain a CMake-compatible numeric version." >&2
                  exit 1
              fi
          else
              tag="snapshot-${GITHUB_SHA::12}"
              version="0.0.0"
          fi

          echo "LIBSCID_RELEASE_PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_VERSION=$tag" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_PACKAGE_VERSION_LABEL=$tag" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_PLATFORM=${{ matrix.asset_label }}" >> "$GITHUB_ENV"

      - name: Release
        run: make libscid.release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release__${{ matrix.asset_label }}
          path: _release/*
          if-no-files-found: error

  release__windoze:
    name: release__windoze
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up libscid toolchain
        uses: ./.github/actions/setup-libscid-toolchain
        with:
          make: "true"
          uv: "true"
          llvm: "true"
          docs: "true"

      - name: Set release identity
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^v', ''
            $version = $version -replace '-.*$', ''

            if ($version -notmatch '^[0-9]+(\.[0-9]+){0,3}$') {
              Write-Error "Tag '$tag' does not contain a CMake-compatible numeric version."
              exit 1
            }
          } else {
            $tag = "snapshot-$($env:GITHUB_SHA.Substring(0, 12))"
            $version = "0.0.0"
          }

          "LIBSCID_RELEASE_PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_PACKAGE_VERSION_LABEL=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_PLATFORM=windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Release
        run: make libscid.release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release__windoze
          path: _release/*
          if-no-files-found: error

  release__publish-github-release:
    name: release__publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release__unix
      - release__windoze
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: libscid ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-testing') }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
