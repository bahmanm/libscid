name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unix-build-and-package:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_label: linux
            cpp_compiler: g++
          - os: macos-15
            asset_label: macos-arm
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation tools
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes default-jre doxygen graphviz plantuml
            plantuml_jar="$(dpkg -L plantuml | awk '/\/plantuml\.jar$/ { print; exit }')"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install doxygen graphviz plantuml
            plantuml_jar="$(brew --prefix plantuml)/libexec/plantuml.jar"
          else
            plantuml_jar=""
          fi

          if [[ -n "$plantuml_jar" && -f "$plantuml_jar" ]]; then
            echo "LIBSCID_PLANTUML_JAR_PATH=$plantuml_jar" >> "$GITHUB_ENV"
          else
            echo "LIBSCID_PLANTUML_JAR_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Set release identity
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            version="${version%%-*}"

            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "Tag '$tag' does not contain a CMake-compatible numeric version." >&2
              exit 1
            fi
          else
            tag="snapshot-${GITHUB_SHA::12}"
            version="0.0.0"
          fi

          echo "LIBSCID_PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "LIBSCID_VERSION=$tag" >> "$GITHUB_ENV"
          echo "LIBSCID_PACKAGE_VERSION_LABEL=$tag" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake
          --preset package
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DLIBSCID_PROJECT_VERSION="$LIBSCID_PROJECT_VERSION"
          -DLIBSCID_VERSION="$LIBSCID_VERSION"
          -DLIBSCID_PACKAGE_VERSION_LABEL="$LIBSCID_PACKAGE_VERSION_LABEL"
          -DLIBSCID_PACKAGE_PLATFORM="${{ matrix.asset_label }}"
          -DLIBSCID_PLANTUML_JAR_PATH="$LIBSCID_PLANTUML_JAR_PATH"

      - name: Build
        run: >
          cmake
          --build
          --preset package
          --verbose

      - name: Package
        run: cpack --preset portable-tgz

      - name: Extract package
        run: |
          archives=( _build/package/*.tar.gz )
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one .tar.gz in _build/package, found ${#archives[@]}." >&2
            ls -la _build/package || true
            exit 1
          fi

          archive="${archives[0]}"
          extract_root="${RUNNER_TEMP}/libscid-package"
          install_root="$extract_root/install"

          rm -rf "$extract_root"
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" --strip-components=1

          echo "PACKAGE_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "ASSET_PATH=$archive" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$(basename "$archive" .tar.gz)" >> "$GITHUB_ENV"

      - name: Test examples against package
        run: |
          examples_build_dir="${RUNNER_TEMP}/libscid-package-examples"

          rm -rf "$examples_build_dir"
          cmake -S "$PACKAGE_INSTALL_ROOT/share/doc/libscid-cpp/examples" -B "$examples_build_dir" -DCMAKE_PREFIX_PATH="$PACKAGE_INSTALL_ROOT"
          cmake --build "$examples_build_dir" --verbose
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="$PACKAGE_INSTALL_ROOT/lib:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$PACKAGE_INSTALL_ROOT/lib:${LD_LIBRARY_PATH:-}"
          fi
          ctest --test-dir "$examples_build_dir" --output-on-failure

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  windoze-build-and-package:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install documentation tools
        run: |
          choco install doxygen.install graphviz --yes --no-progress
          $env:Path += ";C:\Program Files\doxygen\bin;C:\Program Files\Graphviz\bin"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set release identity
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^v', ''
            $version = $version -replace '-.*$', ''

            if ($version -notmatch '^[0-9]+(\.[0-9]+){0,3}$') {
              Write-Error "Tag '$tag' does not contain a CMake-compatible numeric version."
              exit 1
            }
          } else {
            $tag = "snapshot-$($env:GITHUB_SHA.Substring(0, 12))"
            $version = "0.0.0"
          }

          "LIBSCID_PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_PACKAGE_VERSION_LABEL=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: >
          cmake
          --preset package
          "-DLIBSCID_PROJECT_VERSION=$env:LIBSCID_PROJECT_VERSION"
          "-DLIBSCID_VERSION=$env:LIBSCID_VERSION"
          "-DLIBSCID_PACKAGE_VERSION_LABEL=$env:LIBSCID_PACKAGE_VERSION_LABEL"
          "-DLIBSCID_PACKAGE_PLATFORM=windows"

      - name: Build
        run: >
          cmake
          --build
          --preset package
          --config Release
          --verbose

      - name: Package
        run: cpack --preset portable-tgz -C Release

      - name: Extract package
        run: |
          $archives = Get-ChildItem -Path "_build\\package" -Filter "*.tar.gz"
          if ($archives.Count -ne 1) {
            Write-Error "Expected exactly one .tar.gz in _build\\package, found $($archives.Count)."
            Get-ChildItem -Path "_build\\package" | Format-List
            exit 1
          }

          $archive = $archives[0].FullName
          $extractRoot = Join-Path $env:RUNNER_TEMP "libscid-package"
          $installRoot = Join-Path $extractRoot "install"

          Remove-Item -Recurse -Force -ErrorAction Ignore $extractRoot
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          tar -xzf $archive -C $installRoot --strip-components=1

          "PACKAGE_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_NAME=$($archives[0].BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test examples against package
        run: |
          $examplesBuildDir = Join-Path $env:RUNNER_TEMP "libscid-package-examples"
          $examplesSourceDir = Join-Path $env:PACKAGE_INSTALL_ROOT "share/doc/libscid-cpp/examples"

          Remove-Item -Recurse -Force -ErrorAction Ignore $examplesBuildDir
          cmake -S $examplesSourceDir -B $examplesBuildDir "-DCMAKE_PREFIX_PATH=$env:PACKAGE_INSTALL_ROOT"
          cmake --build $examplesBuildDir --config Release --verbose
          $env:Path = "$env:PACKAGE_INSTALL_ROOT\bin;$env:Path"
          ctest --test-dir $examplesBuildDir -C Release --output-on-failure

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unix-build-and-package
      - windoze-build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: libscid-cpp ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-testing') }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
