name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release__unix:
    name: release__${{ matrix.asset_label }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_label: linux
          - os: macos-15
            asset_label: macos-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up libscid toolchain
        uses: ./.github/actions/setup-libscid-toolchain
        with:
          make: "true"
          uv: "true"
          llvm: "true"
          docs: "true"

      - name: Set release identity
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            version="${version%%-*}"

            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "Tag '$tag' does not contain a CMake-compatible numeric version." >&2
              exit 1
            fi
          else
            tag="snapshot-${GITHUB_SHA::12}"
            version="0.0.0"
          fi

          echo "LIBSCID_RELEASE_PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_VERSION=$tag" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_PACKAGE_VERSION_LABEL=$tag" >> "$GITHUB_ENV"
          echo "LIBSCID_RELEASE_PLATFORM=${{ matrix.asset_label }}" >> "$GITHUB_ENV"

      - name: Release
        run: make release

      - name: Extract package
        run: |
          archives=( _release/*.tar.gz )
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one .tar.gz in _release, found ${#archives[@]}." >&2
            ls -la _release || true
            exit 1
          fi

          archive="${archives[0]}"
          extract_root="${RUNNER_TEMP}/libscid-package"
          install_root="$extract_root/install"

          rm -rf "$extract_root"
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" --strip-components=1

          echo "PACKAGE_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Test examples against package
        run: |
          examples_build_dir="${RUNNER_TEMP}/libscid-package-examples"

          rm -rf "$examples_build_dir"
          cmake_args=(
            -S "$PACKAGE_INSTALL_ROOT/share/doc/libscid/examples"
            -B "$examples_build_dir"
            "-DCMAKE_PREFIX_PATH=$PACKAGE_INSTALL_ROOT"
            "-DCMAKE_C_COMPILER=$LIBSCID_C_COMPILER"
            "-DCMAKE_CXX_COMPILER=$LIBSCID_CXX_COMPILER"
          )

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=("-DCMAKE_OSX_SYSROOT=$SDKROOT")
          fi

          cmake "${cmake_args[@]}"
          cmake --build "$examples_build_dir" --verbose
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="$PACKAGE_INSTALL_ROOT/lib:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$PACKAGE_INSTALL_ROOT/lib:${LD_LIBRARY_PATH:-}"
          fi
          ctest --test-dir "$examples_build_dir" --output-on-failure

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release__${{ matrix.asset_label }}
          path: _release/*
          if-no-files-found: error

  release__windoze:
    name: release__windoze
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up libscid toolchain
        uses: ./.github/actions/setup-libscid-toolchain
        with:
          make: "true"
          uv: "true"
          llvm: "true"
          docs: "true"

      - name: Set release identity
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^v', ''
            $version = $version -replace '-.*$', ''

            if ($version -notmatch '^[0-9]+(\.[0-9]+){0,3}$') {
              Write-Error "Tag '$tag' does not contain a CMake-compatible numeric version."
              exit 1
            }
          } else {
            $tag = "snapshot-$($env:GITHUB_SHA.Substring(0, 12))"
            $version = "0.0.0"
          }

          "LIBSCID_RELEASE_PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_PACKAGE_VERSION_LABEL=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBSCID_RELEASE_PLATFORM=windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Release
        run: make release

      - name: Extract package
        run: |
          $archives = Get-ChildItem -Path "_release" -Filter "*.tar.gz"
          if ($archives.Count -ne 1) {
            Write-Error "Expected exactly one .tar.gz in _release, found $($archives.Count)."
            Get-ChildItem -Path "_release" | Format-List
            exit 1
          }

          $archive = $archives[0].FullName
          $extractRoot = Join-Path $env:RUNNER_TEMP "libscid-package"
          $installRoot = Join-Path $extractRoot "install"

          Remove-Item -Recurse -Force -ErrorAction Ignore $extractRoot
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          tar -xzf $archive -C $installRoot --strip-components=1

          "PACKAGE_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test examples against package
        run: |
          $examplesBuildDir = Join-Path $env:RUNNER_TEMP "libscid-package-examples"
          $examplesSourceDir = Join-Path $env:PACKAGE_INSTALL_ROOT "share/doc/libscid/examples"

          Remove-Item -Recurse -Force -ErrorAction Ignore $examplesBuildDir
          cmake `
            -S $examplesSourceDir `
            -B $examplesBuildDir `
            -G Ninja `
            "-DCMAKE_PREFIX_PATH=$env:PACKAGE_INSTALL_ROOT" `
            "-DCMAKE_C_COMPILER=$env:LIBSCID_C_COMPILER" `
            "-DCMAKE_CXX_COMPILER=$env:LIBSCID_CXX_COMPILER"
          cmake --build $examplesBuildDir --verbose
          $env:Path = "$env:PACKAGE_INSTALL_ROOT\bin;$env:Path"
          ctest --test-dir $examplesBuildDir --output-on-failure

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release__windoze
          path: _release/*
          if-no-files-found: error

  release__publish-github-release:
    name: release__publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release__unix
      - release__windoze
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: libscid ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-testing') }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
