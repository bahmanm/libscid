name: pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v6

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-jre doxygen graphviz plantuml
          dpkg -L plantuml | grep '/plantuml\\.jar$' | head -n 1 | sed 's#^#LIBSCID_PLANTUML_JAR_PATH=#' >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure
        run: >
          cmake
          --preset docs
          -DLIBSCID_PLANTUML_JAR_PATH="$LIBSCID_PLANTUML_JAR_PATH"

      - name: Build documentation
        run: >
          cmake
          --build
          --preset docs
          --verbose

      - name: Verify documentation output
        run: test -f _build/docs/doxygen/html/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/docs/doxygen/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
