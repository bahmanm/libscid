name: pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages__build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v7

      - name: Set up libscid documentation tools
        uses: ./.github/actions/setup-libscid-toolchain
        with:
          docs: "true"
          llvm: "true"
          make: "true"
          uv: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: make libscid.docs

      - name: Verify documentation output
        run: |
          test -f _build/docs/public/index.html
          test -f _build/docs/public/capi/index.html
          test -f _build/docs/public/python/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/docs/public

  pages__deploy:
    needs: pages__build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
