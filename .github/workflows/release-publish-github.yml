name: release/publish-github

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.10.0 or v0.10.0b1)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.10.0 or v0.10.0b1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-publish-github__publish:
    name: release-publish-github__publish
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: libscid ${{ steps.vars.outputs.tag }}
          prerelease: ${{ contains(steps.vars.outputs.tag, '-testing') || contains(steps.vars.outputs.tag, '-dev') || contains(steps.vars.outputs.tag, '-beta') || contains(steps.vars.outputs.tag, '-alpha') || contains(steps.vars.outputs.tag, '-rc') || contains(steps.vars.outputs.tag, 'a') || contains(steps.vars.outputs.tag, 'b') || contains(steps.vars.outputs.tag, 'rc') || contains(steps.vars.outputs.tag, 'dev') }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
