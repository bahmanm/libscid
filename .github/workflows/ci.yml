name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci__unix:
    name: ci__${{ matrix.check_label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
          - os: macos-15
            check_label: macos

    steps:
      - uses: actions/checkout@v7

      - name: Run CI suite
        uses: ./.github/actions/build-unix
        with:
          platform_label: ${{ matrix.check_label }}
          target: libscid.internal.default.test libscid.capi.default.test libscid.test-examples
          make_args: LIBSCID_CMAKE_BUILD_ARGS=--verbose

  ci__windoze:
    name: ci__windoze
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Run CI suite
        uses: ./.github/actions/build-windoze
        with:
          platform_label: windoze
          target: libscid.internal.default.test libscid.capi.default.test libscid.test-examples
          make_args: LIBSCID_CMAKE_BUILD_ARGS=--verbose
