name: build and test

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unix-build-and-test:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cpp_compiler: g++
          - os: macos-latest
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure

  windows-build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure
