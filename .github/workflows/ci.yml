name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci__default:
    name: ci__${{ matrix.check_label }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
          - os: macos-15
            check_label: macos
          - os: windows-2022
            check_label: windoze

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GNU Make
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes make
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install make
            echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install make --yes --no-progress
          fi

      - name: Install LLVM toolchain
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes clang-20 clang-tools-20
            echo "LIBSCID_C_COMPILER=clang-20" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=clang++-20" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm@20
            llvm_prefix="$(brew --prefix llvm@20)"
            sdkroot="$(xcrun --show-sdk-path)"
            echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
            echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
            echo "LIBSCID_C_COMPILER=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
            echo "LIBSCID_CMAKE_CONFIGURE_ARGS=-DCMAKE_OSX_SYSROOT=$sdkroot" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco upgrade llvm --yes --no-progress
            choco install ninja --yes --no-progress
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
            echo "LIBSCID_C_COMPILER=C:\\Program Files\\LLVM\\bin\\clang-cl.exe" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=C:\\Program Files\\LLVM\\bin\\clang-cl.exe" >> "$GITHUB_ENV"
            echo "LIBSCID_CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          fi

      - name: Verify GNU Make
        run: make --version

      - name: Run default Make CI
        run: make LIBSCID_CMAKE_BUILD_ARGS=--verbose ci-default

  ci__shared:
    name: ci__${{ matrix.check_label }}-shared
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
          - os: macos-15
            check_label: macos
          - os: windows-2022
            check_label: windoze

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GNU Make
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes make
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install make
            echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install make --yes --no-progress
          fi

      - name: Install uv
        run: python -m pip install uv

      - name: Install LLVM toolchain
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes clang-20 clang-tools-20
            echo "LIBSCID_C_COMPILER=clang-20" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=clang++-20" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm@20
            llvm_prefix="$(brew --prefix llvm@20)"
            sdkroot="$(xcrun --show-sdk-path)"
            echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
            echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
            echo "LIBSCID_C_COMPILER=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
            echo "LIBSCID_CMAKE_CONFIGURE_ARGS=-DCMAKE_OSX_SYSROOT=$sdkroot" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco upgrade llvm --yes --no-progress
            choco install ninja --yes --no-progress
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
            echo "LIBSCID_C_COMPILER=C:\\Program Files\\LLVM\\bin\\clang-cl.exe" >> "$GITHUB_ENV"
            echo "LIBSCID_CXX_COMPILER=C:\\Program Files\\LLVM\\bin\\clang-cl.exe" >> "$GITHUB_ENV"
            echo "LIBSCID_CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          fi

      - name: Verify GNU Make
        run: make --version

      - name: Run shared Make CI
        run: make LIBSCID_CMAKE_BUILD_ARGS=--verbose ci-shared
