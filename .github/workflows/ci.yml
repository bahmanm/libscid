name: build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: >
          sudo apt-get update
          && sudo apt-get install --yes clang-20 clang-format-20 clang-tools-20

      - name: Configure
        run: >
          cmake
          -S .
          -B _build-format
          -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_CXX_COMPILER=clang++-20

      - name: Check formatting
        run: >
          cmake
          --build _build-format
          --target format-check
          --verbose

  unix-build-and-test:
    name: unix-build-and-test (${{ matrix.check_label }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
            c_compiler: clang-20
            cpp_compiler: clang++-20
          - os: macos-15
            check_label: macos
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM toolchain
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update
          && sudo apt-get install --yes clang-20 clang-tools-20

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure

  windoze-build-and-test:
    name: windoze-build-and-test
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure

  unix-shared-build-and-test:
    name: unix-shared-build-and-test (${{ matrix.check_label }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
            c_compiler: clang-20
            cpp_compiler: clang++-20
          - os: macos-15
            check_label: macos
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install LLVM toolchain
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update
          && sudo apt-get install --yes clang-20 clang-tools-20

      - name: Configure
        run: >
          cmake
          -S .
          -B _build-shared
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: >
          cmake
          --build _build-shared
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build-shared
          -C Release
          --output-on-failure

      - name: Test Python examples
        run: |
          library_name="libscid.so"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            library_name="libscid.dylib"
          fi

          python examples/libscid/000-python-bindings/pgn_roundtrip.py \
            --library "_build-shared/src/libscid/${library_name}"

  windoze-shared-build-and-test:
    name: windoze-shared-build-and-test
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Configure
        run: >
          cmake
          -S .
          -B _build-shared
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build _build-shared
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build-shared
          -C Release
          --output-on-failure

      - name: Test Python examples
        run: >
          python
          examples/libscid/000-python-bindings/pgn_roundtrip.py
          --library _build-shared/src/libscid/Release/scid.dll
