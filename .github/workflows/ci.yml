name: build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unix-build-and-test:
    name: unix-build-and-test (${{ matrix.check_label }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
            cpp_compiler: g++
          - os: macos-15
            check_label: macos
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure

  windoze-build-and-test:
    name: windoze-build-and-test
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake
          -S .
          -B _build
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build _build
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build
          -C Release
          --output-on-failure

  unix-shared-build-and-test:
    name: unix-shared-build-and-test (${{ matrix.check_label }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_label: linux
            cpp_compiler: g++
          - os: macos-15
            check_label: macos
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake
          -S .
          -B _build-shared
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: >
          cmake
          --build _build-shared
          --config Release
          --verbose

      - name: Test
        run: >
          ctest
          --test-dir _build-shared
          -C Release
          --output-on-failure

  windoze-shared-build-and-test:
    name: windoze-shared-build-and-test
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake
          -S .
          -B _build-shared
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build _build-shared
          --config Release
          --verbose

      - name: Test
        run: |
          $env:Path = "$PWD\_build-shared\libscid\Release;$PWD\_build-shared\libscid-cpp\core\Release;$PWD\_build-shared\libscid-cpp\eco\Release;$PWD\_build-shared\libscid-cpp\database\Release;$PWD\_build-shared\libscid-cpp\spelling\Release;$env:Path"
          ctest --test-dir _build-shared -C Release --output-on-failure
