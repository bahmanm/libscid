name: Build libscid on Windows
description: Builds, tests, or packages libscid on Windows MSVC runners.

inputs:
  target:
    description: "GNU Make target(s) to execute"
    required: true
  platform_label:
    description: "Platform asset label (e.g. windoze)"
    default: "windoze"
  is_release:
    description: "Whether this is a release build requiring release identity and artefact upload"
    default: "false"
  docs:
    description: "Install documentation tools (Doxygen, PlantUML)"
    default: "false"
  make_args:
    description: "Additional arguments to pass to make"
    default: ""
  python_version:
    description: "Python version for setup-python"
    default: "3.x"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up libscid toolchain
      uses: ./.github/actions/setup-libscid-toolchain
      with:
        make: "true"
        uv: "true"
        llvm: "true"
        docs: ${{ inputs.docs }}

    - name: Set release identity
      if: ${{ inputs.is_release == 'true' }}
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $tag = $env:GITHUB_REF_NAME
          $raw_version = $tag -replace '^v', ''
          if ($raw_version -match '^([0-9]+(\.[0-9]+){0,3})') {
            $numeric_version = $Matches[1]
          } else {
            Write-Error "Tag '$tag' does not contain a CMake-compatible numeric version."
            exit 1
          }
          $python_version = $raw_version
        } else {
          $tag = "snapshot-$($env:GITHUB_SHA.Substring(0, 12))"
          $numeric_version = "0.0.0"
          $python_version = "0.0.0"
        }

        "LIBSCID_RELEASE_PROJECT_VERSION=$numeric_version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBSCID_RELEASE_PYTHON_VERSION=$python_version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBSCID_RELEASE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBSCID_RELEASE_PACKAGE_VERSION_LABEL=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBSCID_RELEASE_PLATFORM=windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Execute Make target
      shell: pwsh
      run: make ${{ inputs.make_args }} ${{ inputs.target }}

    - name: Upload release artifacts
      if: ${{ inputs.is_release == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: release-build__${{ inputs.platform_label }}
        path: _release/*
        if-no-files-found: error
