name: Publish Python packages to PyPI
description: Downloads Python wheels from GitHub Release and publishes them to PyPI using Trusted Publishing.

inputs:
  tag:
    description: "Release tag to publish"
    required: true
  packages_dir:
    description: "Local directory for downloaded wheel distributions"
    default: "dist-pypi"

runs:
  using: composite
  steps:
    - name: Download wheel assets from GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "${{ inputs.packages_dir }}"
        gh release download "${{ inputs.tag }}" \
          --repo "${{ github.repository }}" \
          --pattern "*.whl" \
          --dir "${{ inputs.packages_dir }}"

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ inputs.packages_dir }}/
        skip-existing: true
