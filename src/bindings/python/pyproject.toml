[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "libscid"
description = "Python bindings for libscid."
requires-python = ">=3.10"
license = "GPL-2.0-only"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.14",
    "tox>=4.0",
    "tox-uv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libscid"]
artifacts = [
    "src/libscid/_native/*.dll",
    "src/libscid/_native/*.dylib",
    "src/libscid/_native/*.so",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["../../../tests/bindings/python"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "../../../tests/bindings/python"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pyright]
include = ["src", "hatch_build.py"]
exclude = [
    "**/__pycache__",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
